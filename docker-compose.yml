services:
  scraper:
    build: .
    container_name: tower-scraper
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - APP_PORT=${APP_PORT}
      - MCP_API_KEY=${MCP_API_KEY}
      - API_USERNAME=${API_USERNAME}
      - API_PASSWORD=${API_PASSWORD}
      - TOWER_USERNAME=${TOWER_USERNAME}
      - TOWER_PASSWORD=${TOWER_PASSWORD}
      - DB_PORT=${DB_PORT}
      - TOWER_COVERAGE_CONCURRENCY=${TOWER_COVERAGE_CONCURRENCY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: #para poder ver los archivos de la aplicacion
      - ./:/app